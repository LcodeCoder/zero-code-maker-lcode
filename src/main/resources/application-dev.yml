spring:
  application:
    name: ai-lcode
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_lcode_maker}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: utf-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
server:
  port: 8080
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.commul.ailcode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI（OpenAI 兼容接口）
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://token.sensenova.cn/v1}
      api-key: ${AI_API_KEY:}
      model-name: ${AI_MODEL_NAME:deepseek-v4-flash}
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://token.sensenova.cn/v1}
      api-key: ${AI_API_KEY:}
      model-name: ${AI_MODEL_NAME:deepseek-v4-flash}
      log-requests: true
      log-responses: true
      max-tokens: 8192
